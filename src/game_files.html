<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<base href="@BASE_URL@" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="openmh-extractor" content="@EXTRACTOR_URL@" />
		<meta name="openmh-assets" content="@ASSET_URL@" />
		<meta name="openmh-content-label" content="@CONTENT_LABEL@" />
		<meta name="description" content="Manage your Motorhead game library." />
		<title>OpenMH - Game library</title>
		<link rel="icon" href="favicon.ico" type="image/x-icon" />
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<main>
			@SITE_HEADER@
			@LIBRARY_NAVIGATION@
			<section id="library-panel" role="tabpanel" aria-labelledby="library-tab">
				<div id="package-tools">
					@PACKAGE_LIBRARY@
				</div>
			</section>
			@PREPARE_GAME@
			@DOWNLOADS@
		</main>
		@RUNTIME_SERVICES@
		@PACKAGE_SCRIPTS@
		<script src="prepare_game.js"></script>
		<script src="game_files.js"></script>
	</body>
</html>
